name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__ApexPostTestServer: Server=localhost,1433;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Apex_Post_Logistic.slnx

      - name: Build
        run: dotnet build Apex_Post_Logistic.slnx -c Release --no-restore

      - name: Test (without measurement tests)
        run: dotnet test Apex_Post_Logistic.slnx -c Release --no-build --filter "Category!=Measurement"
