name: CI

on:
  push:
    branches: [main, chore/setup, 'week4-*']
  pull_request:
    branches: [main, chore/setup, 'week4-*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The container lives for this run only, so its password is made per run and no stored secret is needed.
      ConnectionStrings__ApexPostTestServer: Server=localhost,1433;User Id=sa;Password=Ci-${{ github.run_id }}-${{ github.run_attempt }}-aA1!;Encrypt=True;TrustServerCertificate=True
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-aA1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Apex_Post_Logistic.slnx

      - name: Build
        run: dotnet build Apex_Post_Logistic.slnx -c Release --no-restore

      - name: Test (without measurement tests)
        run: dotnet test Apex_Post_Logistic.slnx -c Release --no-build --filter "Category!=Measurement"
